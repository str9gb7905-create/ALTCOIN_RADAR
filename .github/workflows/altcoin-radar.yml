name: ALTCOIN RADAR

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send the production-format Telegram preview only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: altcoin-radar-production
  cancel-in-progress: false

jobs:
  telegram-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Send production-format Telegram preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          from textwrap import dedent

          from notification_dispatcher import TelegramDispatcher

          message = dedent("""\
          🧪 ALTCOIN RADAR｜正式格式測試
          ⚠️ 以下為排版測試假資料，不是即時行情或投資訊號

          LSK｜價格異動測試
          觸發：24H_DOWN（首次達到 -10%）
          價格：US$0.3708
          1H：-1.60%
          24H：-16.00%
          層級：T1（10%）
          4H RSI：28.3｜狀態：NORMAL
          RSI速度：無
          成交量：1.80× 近期中位數
          日線背離：無
          週線背離：無
          資料來源：CoinGecko＋公開現貨交易所

          CoinGecko：
          https://www.coingecko.com/en/coins/lisk
          TradingView：
          https://www.tradingview.com/chart/?symbol=BINANCE%3ALSKUSDT

          只測試 Telegram 顯示與連結；正式自動通知已啟用。
          """).strip()

          try:
              result = TelegramDispatcher.from_env().send(message)
          except Exception:
              print("TELEGRAM_TEST_STATUS=UNEXPECTED_FAILURE")
              raise SystemExit(1)

          print(f"TELEGRAM_TEST_STATUS={result.status}")
          if result.status != "SUCCESS":
              raise SystemExit(1)
          PY

  radar:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.telegram_test != true) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Restore authoritative state
        run: |
          git fetch --no-tags origin radar-state:refs/remotes/origin/radar-state
          python cloud_state_sync.py restore --ref origin/radar-state

      - name: Run pipeline
        id: pipeline
        shell: bash
        run: |
          set +e
          python run_pipeline.py
          pipeline_exit=$?
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "exit_code=$pipeline_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check internal heartbeat
        id: health
        if: always() && steps.pipeline.outputs.ran == 'true'
        shell: bash
        run: |
          set +e
          python health_check.py
          health_exit=$?
          echo "exit_code=$health_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and prepare production notification
        id: prepare_delivery
        if: steps.pipeline.outputs.exit_code == '0' && steps.health.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python notification_merger.py
          prepare_output=$(python notification_delivery.py prepare)
          echo "$prepare_output"
          if [[ "$prepare_output" == "NO_NOTIFICATION" ]]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist pipeline and pending delivery state
        id: persist_pending
        if: >-
          always() && steps.pipeline.outputs.ran == 'true' &&
          (steps.pipeline.outputs.exit_code != '0' ||
           steps.health.outputs.exit_code != '0' ||
           steps.prepare_delivery.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/persist_authoritative_state.sh \
            "$RUNNER_TEMP/altcoin-radar-state-pending" "$GITHUB_OUTPUT"

      - name: Claim next production notification
        id: claim_delivery
        if: steps.persist_pending.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          claim_output=$(python notification_delivery.py claim)
          echo "$claim_output"
          if [[ "$claim_output" == DELIVERY_CLAIMED\ notification_id=* ]]; then
            echo "claimed=true" >> "$GITHUB_OUTPUT"
            echo "notification_id=${claim_output#DELIVERY_CLAIMED notification_id=}" >> "$GITHUB_OUTPUT"
          else
            echo "claimed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist durable delivery claim
        id: persist_claim
        if: steps.claim_delivery.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/persist_authoritative_state.sh \
            "$RUNNER_TEMP/altcoin-radar-state-claim" "$GITHUB_OUTPUT"

      - name: Send production Telegram notification
        id: dispatch_delivery
        if: steps.claim_delivery.outputs.claimed == 'true' && steps.persist_claim.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFICATION_ID: ${{ steps.claim_delivery.outputs.notification_id }}
        shell: bash
        run: |
          set +e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          dispatch_output=$(python notification_delivery.py dispatch \
            --notification-id "$NOTIFICATION_ID" 2>&1)
          dispatch_exit=$?
          echo "$dispatch_output"
          echo "exit_code=$dispatch_exit" >> "$GITHUB_OUTPUT"
          if [[ "$dispatch_output" == DELIVERY_SUCCESS\ notification_id=* ]]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Persist delivery result
        id: persist_result
        if: steps.dispatch_delivery.outputs.attempted == 'true' && always()
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/persist_authoritative_state.sh \
            "$RUNNER_TEMP/altcoin-radar-state-result" "$GITHUB_OUTPUT"

      - name: Log deployment status
        if: always() && steps.pipeline.outputs.ran == 'true'
        shell: bash
        env:
          STATE_PERSISTENCE_STATUS: ${{ steps.persist_pending.outputs.status }}
          DELIVERY_CLAIMED: ${{ steps.claim_delivery.outputs.claimed }}
          DELIVERY_STATUS: ${{ steps.dispatch_delivery.outputs.status }}
          DELIVERY_RESULT_PERSISTENCE: ${{ steps.persist_result.outputs.status }}
        run: |
          python - <<'PY'
          import json
          import os

          with open("state/run_status.json", encoding="utf-8") as handle:
              status = json.load(handle)
          with open("state/heartbeat.json", encoding="utf-8") as handle:
              heartbeat = json.load(handle)
          print(f"run_id={status.get('run_id')}")
          print(f"started_utc={status.get('started_at_utc')}")
          print(f"watchlist_expected={status.get('watchlist_expected')}")
          print(f"market_data_returned={status.get('market_data_returned')}")
          print(f"coverage={status.get('coverage_pct')}")
          print(f"stage_a_triggers={status.get('active_trigger_count')}")
          print(f"radar_assets_baselined={status.get('radar_assets_baselined')}")
          print(f"technical_assets_baselined={status.get('technical_assets_baselined')}")
          print(f"divergence_assets_baselined={status.get('divergence_assets_baselined')}")
          print(f"stage_b_attempted={status.get('stage_b_attempted')}")
          print(f"divergence_attempted={status.get('divergence_attempted')}")
          print(f"notification_candidates={status.get('notification_candidate_count')}")
          print(f"API_requests_total={status.get('API_requests_total')}")
          print(f"elapsed_total={status.get('elapsed_total')}")
          print(f"health_last_success_run_id={heartbeat.get('last_success_run_id')}")
          print(f"state_persistence_status={os.environ.get('STATE_PERSISTENCE_STATUS')}")
          print(f"delivery_claimed={os.environ.get('DELIVERY_CLAIMED')}")
          print(f"delivery_status={os.environ.get('DELIVERY_STATUS')}")
          print(f"delivery_result_persistence={os.environ.get('DELIVERY_RESULT_PERSISTENCE')}")
          PY

      - name: Enforce final result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.persist_pending.outcome }}" != "success" ]]; then
            echo "STATE_PERSISTENCE_FAILED"
            exit 1
          fi
          if [[ "${{ steps.persist_pending.outputs.status }}" != "SUCCESS" && "${{ steps.persist_pending.outputs.status }}" != "NO_CHANGE" ]]; then
            echo "STATE_PERSISTENCE_FAILED"
            exit 1
          fi
          if [[ "${{ steps.pipeline.outputs.exit_code }}" != "0" ]]; then
            echo "PIPELINE_FAILED_OR_INCOMPLETE"
            exit 1
          fi
          if [[ "${{ steps.health.outputs.exit_code }}" != "0" ]]; then
            echo "RADAR_HEALTH_DEGRADED"
            exit 1
          fi
          if [[ "${{ steps.prepare_delivery.outcome }}" != "success" ]]; then
            echo "NOTIFICATION_PREPARATION_FAILED"
            exit 1
          fi
          if [[ "${{ steps.claim_delivery.outcome }}" != "success" || "${{ steps.persist_claim.outcome }}" != "success" ]]; then
            echo "DELIVERY_CLAIM_FAILED"
            exit 1
          fi
          if [[ "${{ steps.claim_delivery.outputs.claimed }}" == "true" ]]; then
            if [[ "${{ steps.dispatch_delivery.outputs.status }}" != "SUCCESS" ]]; then
              echo "TELEGRAM_DELIVERY_FAILED_OR_UNKNOWN"
              exit 1
            fi
            if [[ "${{ steps.persist_result.outcome }}" != "success" ]]; then
              echo "DELIVERY_RESULT_PERSISTENCE_FAILED"
              exit 1
            fi
          fi
          echo "WORKFLOW_SUCCESS"
